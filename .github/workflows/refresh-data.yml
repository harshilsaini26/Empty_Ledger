name: Refresh SEC data

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download every company, not only those with a new 10-K"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: pipeline
        run: python -m unittest discover -s tests
      # Keep downloaded SEC files between runs, so a weekly run only fetches companies with a new 10-K.
      - uses: actions/cache@v5
        with:
          path: pipeline/.cache/sec
          key: sec-${{ github.run_id }}
          restore-keys: sec-
      - name: Check the SEC contact
        env:
          # Set this repository secret to "Your Name your.email@example.com" (SEC fair-access rule)
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Add a repository secret named SEC_USER_AGENT, e.g. 'Your Name you@example.com' (required by the SEC)."
            exit 1
          fi
      - name: Pick the top 50
        working-directory: pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python build_universe.py
      - name: Build statements and ratios
        working-directory: pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python build_dataset.py ${{ inputs.full && '--refresh' || '' }}
      - name: Summary
        working-directory: pipeline
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          u = json.load(open("data/universe.json")); i = json.load(open("data/index.json"))
          print(f"**{len(i['companies'])} companies built**, {len(i['failed'])} failed.")
          print(f"Joined the top 50: {', '.join(u['joined']) or 'none'}. Left: {', '.join(u['left']) or 'none'}.")
          for t, e in i["failed"].items():
              print(f"- {t}: {e}")
          EOF
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data pipeline/companies.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh the S&P top 50 from SEC EDGAR"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
